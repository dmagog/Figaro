# Отдельный образ Figaro v3 (figaro-v3): самодостаточный dev-контейнер.
# БД — sqlite в ./instance (переживает рестарт), код смонтирован для авто-reload,
# схема и демо-данные засеиваются при старте (идемпотентно). Postgres/redis/scheduler
# не нужны для веб-демо — их можно добавить позже для прод-паритета.
services:
  app:
    build: .
    image: figaro-v3
    container_name: figaro-v3
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////app/instance/figaro_dev.db
      - PYTHONUNBUFFERED=1
    # засеять (идемпотентно) и поднять uvicorn с авто-reload по изменениям в figaro/
    command: >
      sh -c "python -m figaro.web.devseed --data-dir data &&
             uvicorn figaro.web.app:app --host 0.0.0.0 --port 8080 --reload --reload-dir figaro"
    volumes:
      - .:/app                       # код + ./instance (sqlite) монтируются с хоста → live-reload и персист
    ports:
      - "8754:8080"                  # нестандартный хост-порт (8731/49080/49432 заняты другими проектами)
